name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10'
            php: '8.2'
          - laravel: '13'
            testbench: '11'
            php: '8.3'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install matching-major dependencies
        run: >-
          composer update
          --with "illuminate/console:^${{ matrix.laravel }}.0"
          --with "illuminate/database:^${{ matrix.laravel }}.0"
          --with "illuminate/filesystem:^${{ matrix.laravel }}.0"
          --with "illuminate/support:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:^${{ matrix.testbench }}.0"
          --no-interaction
          --no-progress
          --prefer-dist

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

  interoperability:
    name: Interoperability / ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: moduark
            directory: Moduark
          - adapter: nwidart
            directory: Nwidart

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate root Composer metadata
        run: composer validate --strict

      - name: Run matching-major interoperability tests
        run: composer test:${{ matrix.adapter }}

      - name: Audit interoperability dependencies
        run: |
          composer audit --locked --no-interaction --working-dir=tests/Interop/${{ matrix.directory }}/Laravel12
          composer audit --locked --no-interaction --working-dir=tests/Interop/${{ matrix.directory }}/Laravel13

  consumer:
    name: Clean package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run clean consumer acceptance
        run: composer test:consumer
